<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0612">
<!-- trang riêng tư: không cho công cụ tìm kiếm lập chỉ mục -->
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Chúc mừng sinh nhật Bố</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="is-intro">

<!-- ══════════ MÀN 1+2 · BÁNH KEM & NẾN ══════════ -->
<section id="scene-cake" class="scene">
  <div class="ambient"></div>

  <div class="cake-wrap">
    <div class="cake">
      <!-- nến -->
      <div class="candles">
        <div class="candle" style="--i:0">
          <div class="flame"><span class="flame-core"></span></div>
          <div class="smoke"></div>
          <div class="wick"></div>
          <div class="stick"></div>
        </div>
        <div class="candle" style="--i:1">
          <div class="flame"><span class="flame-core"></span></div>
          <div class="smoke"></div>
          <div class="wick"></div>
          <div class="stick"></div>
        </div>
        <div class="candle" style="--i:2">
          <div class="flame"><span class="flame-core"></span></div>
          <div class="smoke"></div>
          <div class="wick"></div>
          <div class="stick"></div>
        </div>
      </div>

      <!-- tầng trên -->
      <div class="tier tier-top">
        <div class="frosting"></div>
      </div>
      <!-- tầng dưới -->
      <div class="tier tier-bottom">
        <div class="frosting"></div>
        <div class="dots"></div>
      </div>
      <div class="plate"></div>
    </div>
  </div>

  <div class="hint" id="hint">
    <span class="ripple"></span>
    <span class="ripple ripple-2"></span>
    <span class="hand">👆</span>
    <p>Chạm vào nến để thổi</p>
  </div>
</section>

<!-- ══════════ MÀN 3 · PHÁO HOA & LỜI CHÚC ══════════ -->
<canvas id="fx"></canvas>

<section id="scene-message" class="scene" aria-hidden="true">
  <h1 class="wish">
    <span class="wish-line" style="--d:0">CHÚC MỪNG</span>
    <span class="wish-line" style="--d:1">SINH NHẬT</span>
    <span class="wish-line wish-big" style="--d:2">BỐ</span>
  </h1>
  <p class="wish-sub" style="--d:3">Ba mẹ con chúc bố thật nhiều sức khỏe, chân cứng đá mềm nơi đầu sóng ngọn gió.</p>
  <p class="wish-sub" style="--d:4">Mong bố luôn bình an, vui khỏe mỗi ngày để mãi là điểm tựa vững vàng của gia đình mình.</p>
</section>

<!-- ══════════ MÀN 4 · CHỒNG ẢNH TRÔI TỪ TRÊN XUỐNG ══════════ -->
<main id="gallery" aria-hidden="true"></main>
<p class="tap-hint">Chạm để dừng · Vuốt lên xuống để đổi tốc độ</p>
<p class="speed-badge" id="speed-badge" aria-live="polite"></p>

<!-- điều khiển -->
<div class="controls">
  <button id="btn-sound" class="ctrl" type="button" aria-label="Tắt nhạc" hidden>
    <svg viewBox="0 0 24 24" class="ico-on"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <svg viewBox="0 0 24 24" class="ico-off"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9.5l5 5M22 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <button id="btn-replay" class="ctrl" type="button" aria-label="Thổi lại nến" hidden>🕯️</button>
</div>

<script src="app.js"></script>
</body>
</html>
